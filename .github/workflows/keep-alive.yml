name: Održavanje projekta budnim

# Besplatni Supabase plan pauzira projekt nakon tjedan dana neaktivnosti, a
# pauziran projekt nije dostupan dok se ručno ne obnovi — stranica bi pala.
# Kroz zimu je sasvim moguće da tjedan dana nitko ne posjeti stranicu, a
# uvoz rejtinga radi tek jednom mjesečno.
#
# Svaka tri dana, dakle s dovoljno zalihe prije praga od sedam.
#
# Usput briše zapise o pokušajima prijave koje checkRateLimit nije stigao
# obrisati jer na stranici dugo nitko nije ništa pokušao. Izjava o
# privatnosti (12.3) obećaje da se brišu najkasnije u roku od četiri dana;
# */3 po danu u mjesecu daje najviše tri dana razmaka (28. -> 1.), pa ta
# tvrdnja ima dan zalihe i u veljači. Isto tako prazni i briše stari trag
# izmjena (audit_log) po rokovima iz točke 12.5.
on:
  schedule:
    - cron: "30 4 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dodirni bazu i počisti stare zapise o pokušajima
        env:
          PGURL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${PGURL:-}" ]; then
            echo "GREŠKA: tajna DATABASE_URL nije postavljena."
            echo "Postavi je u Settings -> Secrets and variables -> Actions."
            echo "Vrijednost je session pooler adresa (port 5432)."
            exit 1
          fi
          # Adresa se NE širi u ljusci domaćina nego unutar kontejnera —
          # inače bi se pojavila u popisu procesa.
          #
          # SQL ide kroz stdin. ON_ERROR_STOP je nužan: bez njega psql nakon
          # greške u delete nastavi, izađe s 0 i ping tiho ne radi ništa.
          #
          # '1 hour' MORA biti jednak NAJDULJI_PROZOR_MS u
          # lib/rate-limit-rules.ts. Manje bi brisalo retke koje brojač po
          # računu još broji; više bi kršilo izjavu o privatnosti.
          #
          # Trag izmjena (audit_log) ima dva roka, izjava o privatnosti 12.5:
          # sadržaj izmjene (before/after) šest mjeseci, ostatak retka dvije
          # godine. Iste vrijednosti stoje u lib/audit-rokovi.ts.
          #
          # count iza brisanja ostaje kao dokaz da baza odgovara na upit.
          docker run --rm -i -e PGURL postgres:17 \
            sh -c 'psql "$PGURL" -At -v ON_ERROR_STOP=1' <<'SQL'
          delete from public.rate_limit_hits
            where "createdAt" < now() - interval '1 hour';
          update public.audit_log
            set before = null, after = null
            where at < now() - interval '6 months'
              and (before is not null or after is not null);
          delete from public.audit_log
            where at < now() - interval '2 years';
          select count(*) from public.players;
          SQL
