name: Uvoz FIDE rejtinga

# Trećeg u mjesecu u 06:17 UTC.
#
# NE prvog: 1.11.2026. Lichess je tog jutra još služio listopadsku listu,
# pa bi uvoz upisao prošlomjesečne vrijednosti pod ovomjesečnim datumom —
# tiho i zeleno. Do trećega je Lichess uvijek prešao na novu listu.
#
# NE u punom satu: zakazani zadaci u :00 su u najvećoj gužvi i GitHub ih
# zna odgoditi ili posve preskočiti, kao 1.11.2026., kad prolaza nije ni
# bilo. Minuta 17 nije magična, samo je izvan gužve.
#
# Uvoz ide preko Lichessova FIDE API-ja, ne izravno s ratings.fide.com.
# FIDE odbija promet iz podatkovnih centara — veza s GitHubovih poslužitelja
# istekne prije nego se uspostavi (UND_ERR_CONNECT_TIMEOUT). Lichess iste te
# službene liste povlači sam i nudi ih po igraču, a njega ne blokira nitko.
#
# Službeni izvor ostaje dostupan za ručno pokretanje s kućnog priključka:
#
#     npm run fide:import -- --izvor=fide
#
# Vidi docs/rejtinzi.md.
on:
  schedule:
    - cron: "17 6 3 * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Probni prolaz bez upisa u bazu"
        type: boolean
        default: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - name: Uvoz rejtinga
        env:
          # Postavi u Settings -> Secrets and variables -> Actions.
          # Koristi DIRECT_URL (session pooler), ne transaction pooler.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npm run fide:import -- --dry-run
          else
            npm run fide:import
          fi
