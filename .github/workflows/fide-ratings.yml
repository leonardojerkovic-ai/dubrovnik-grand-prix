name: Uvoz FIDE rejtinga

# BEZ RASPOREDA, namjerno.
#
# FIDE odbija promet iz podatkovnih centara: veza na ratings.fide.com:443
# s GitHubovih poslužitelja istekne prije nego se uspostavi
# (UND_ERR_CONNECT_TIMEOUT, tri pokušaja zaredom). Isti uvoz s kućnog
# priključka prolazi bez problema. To se ne da popraviti podešavanjem
# zadatka, pa zakazano pokretanje ovdje ne bi radilo ništa osim što bi
# svakog prvog u mjesecu slalo obavijest o neuspjehu.
#
# Uvoz se zato pokreće na vlastitom računalu:
#
#     npm run fide:import -- --dry-run
#     npm run fide:import
#
# Da se na to ne zaboravi, zaseban zadatak (podsjetnik-rejtinzi.yml) prvog
# u mjesecu provjerava datum liste u bazi i javi ako je zastarjela.
#
# Ručno pokretanje ostaje, za slučaj da FIDE jednom prestane blokirati.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Probni prolaz bez upisa u bazu"
        type: boolean
        default: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - name: Uvoz rejtinga
        env:
          # Postavi u Settings -> Secrets and variables -> Actions.
          # Koristi DIRECT_URL (session pooler), ne transaction pooler.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npm run fide:import -- --dry-run
          else
            npm run fide:import
          fi
